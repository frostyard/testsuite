name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-present:
    name: Pipeline present
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test repository policy and workflow contracts
        run: python3 -m unittest discover -s policies -p 'test_*.py'

      - name: Enforce repository policy
        run: python3 policies/check_repository.py

      - name: Install unit-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-behave python3-pytest

      - name: Test BDD framework
        env:
          PYTHONPATH: .
        run: /usr/bin/python3 -m pytest -q tests/unit

      - name: Confirm CI is wired
        run: |
          echo "CI/CD pipeline is configured for this repository."
          echo "Runtime behave suites are exercised by frostyard/lab against live images."
