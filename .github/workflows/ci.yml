# CI entry (frostyard core ADR-0071 row B12): 1 job `gate` runs `make ci`, the
# make gate of ADR-0043 and ADR-0044 (template gate, corrections, repository
# policy, the policy unittests, the pytest unit suite, feature discovery).
# behave and pytest come from the distribution packages `python3-behave` and
# `python3-pytest`, so no Python here comes from pip (ADR-0043).
# ADR-0021: SHA-pinned actions, top-level permissions {}, contents: read only,
# and checkout does not persist credentials. No secrets.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-corrections.mjs --base reads the base commit's copy.
          fetch-depth: 0
      # Node comes from mise.toml and mise.lock (ADR-0043), checksum-verified,
      # the same way a developer's `mise install` does.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: node
          cache: true
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-behave python3-pytest
      - run: make ci PYTHON=/usr/bin/python3 BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}
